<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Verifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #f3f4f6;
            display: none;
        }

        .result-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Trust Verifier</h1>

    <p class="description">
        Verify whether a source supports a claim using GenLayer consensus.
    </p>

    <label for="claim">Claim</label>
    <input
        type="text"
        id="claim"
        placeholder="Enter the claim you want to verify"
    >

    <label for="source">Source URL</label>
    <input
        type="url"
        id="source"
        placeholder="https://example.com"
    >

    <button id="verifyButton" type="button">
        Verify Claim
    </button>

    <div id="result">
        <div class="result-title">Verification Result</div>
        <div id="resultText"></div>
    </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
